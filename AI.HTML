<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — Local AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:820px;display:flex;flex-direction:column;border-left:1px solid #30363d;border-right:1px solid #30363d}
header{padding:10px 14px;background:#161b22;border-bottom:1px solid #30363d;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{margin-right:auto}
select,input,button,textarea{font:inherit;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px}
button{background:#238636;border:none;cursor:pointer;font-weight:600}
button:hover{background:#2ea043} button:disabled{background:#30363d;cursor:not-allowed}
button.ghost{background:#21262d}button.ghost:hover{background:#30363d}
#bar{height:4px;background:#30363d;display:none}
#fill{height:100%;width:0;background:#1f6feb;transition:width .2s}
#status{font-size:12px;color:#8b949e;padding:4px 14px;min-height:20px}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:11px 15px;border-radius:14px;line-height:1.55;word-wrap:break-word}
.bot{background:#21262d;align-self:flex-start;border-bottom-left-radius:4px}
.user{background:#1f6feb;align-self:flex-end;border-bottom-right-radius:4px}
.msg pre{background:#0d1117;padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0;border:1px solid #30363d}
.msg code{background:#0d1117;padding:2px 5px;border-radius:4px;font-size:.9em}
footer{display:flex;gap:8px;padding:12px;border-top:1px solid #30363d;background:#161b22}
textarea{flex:1;resize:none;max-height:140px;outline:none}
textarea:focus{border-color:#1f6feb}
#settings{display:none;padding:12px 14px;background:#161b22;border-bottom:1px solid #30363d;gap:8px;flex-direction:column}
.cursor::after{content:"▍";animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>🧠 NOVA</b>
    <select id="mode">
      <option value="local">Local (in-browser)</option>
      <option value="api">Cloud API</option>
    </select>
    <select id="model">
      <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Llama 3.2 1B — fast (~0.9 GB)</option>
      <option value="Llama-3.2-3B-Instruct-q4f32_1-MLC">Llama 3.2 3B — smarter (~2.3 GB)</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B (~1.1 GB)</option>
      <option value="Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 Coder 1.5B (~1.1 GB)</option>
      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi 3.5 Mini (~2.2 GB)</option>
    </select>
    <button id="load">Load model</button>
    <button id="gear" class="ghost">⚙</button>
  </header>

  <div id="settings">
    <input id="sys" placeholder="System prompt" value="You are NOVA, a concise, helpful AI assistant.">
    <input id="url" placeholder="API base URL (e.g. https://api.openai.com/v1)">
    <input id="key" type="password" placeholder="API key (stored locally in your browser)">
    <input id="apimodel" placeholder="API model name (e.g. gpt-4o-mini)">
    <div style="display:flex;gap:8px">
      <button class="ghost" id="save">Save</button>
      <button class="ghost" id="clear">Clear chat</button>
      <button class="ghost" id="export">Export chat</button>
      <label style="margin-left:auto;font-size:13px;color:#8b949e">
        <input type="checkbox" id="tts" style="vertical-align:middle"> speak replies
      </label>
    </div>
  </div>

  <div id="bar"><div id="fill"></div></div>
  <div id="status">Pick a model and hit “Load model”. First load downloads it once, then it's cached offline.</div>
  <div id="chat"></div>

  <footer>
    <textarea id="box" rows="1" placeholder="Ask me anything…"></textarea>
    <button id="mic" class="ghost" title="Voice input">🎤</button>
    <button id="send">Send</button>
    <button id="stop" class="ghost" style="display:none">■</button>
  </footer>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const $ = id => document.getElementById(id);
const chat=$('chat'), box=$('box'), status=$('status'), bar=$('bar'), fill=$('fill');
let engine=null, history=[], busy=false, abort=null;

/* ---------- settings persistence ---------- */
const S = JSON.parse(localStorage.getItem('nova')||'{}');
$('url').value = S.url || 'https://api.openai.com/v1';
$('key').value = S.key || '';
$('apimodel').value = S.apimodel || 'gpt-4o-mini';
if (S.sys) $('sys').value = S.sys;
$('save').onclick = () => {
  localStorage.setItem('nova', JSON.stringify({
    url:$('url').value, key:$('key').value, apimodel:$('apimodel').value, sys:$('sys').value }));
  status.textContent='Settings saved.';
};
$('gear').onclick = () => {
  const s=$('settings'); s.style.display = s.style.display==='flex' ? 'none' : 'flex';
};

/* ---------- rendering ---------- */
function md(t){
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return esc(t)
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c}</code></pre>`)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}
function add(text, who){
  const d=document.createElement('div');
  d.className='msg '+who;
  d.innerHTML = md(text);
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return d;
}

/* ---------- load local model ---------- */
$('load').onclick = async () => {
  if (!navigator.gpu){
    status.textContent='❌ WebGPU not available. Use Chrome/Edge 113+ (or switch to Cloud API mode).';
    return;
  }
  $('load').disabled=true; bar.style.display='block';
  try{
    engine = await webllm.CreateMLCEngine($('model').value, {
      initProgressCallback: r => {
        status.textContent = r.text;
        fill.style.width = Math.round((r.progress||0)*100)+'%';
      }
    });
    status.textContent='✅ Model ready — running 100% on your device.';
    bar.style.display='none';
  }catch(e){
    status.textContent='Load failed: '+e.message;
  }
  $('load').disabled=false;
};

/* ---------- send ---------- */
async function send(){
  const text = box.value.trim();
  if(!text || busy) return;
  add(text,'user'); box.value=''; box.style.height='auto';
  history.push({role:'user',content:text});

  busy=true; $('send').disabled=true; $('stop').style.display='inline-block';
  const out = add('','bot'); out.classList.add('cursor');
  let full='';

  const msgs=[{role:'system',content:$('sys').value},...history.slice(-20)];

  try{
    if($('mode').value==='local'){
      if(!engine){ out.textContent='Load a model first (top-right button).'; throw 0; }
      const stream = await engine.chat.completions.create({messages:msgs, stream:true, temperature:0.7});
      for await (const c of stream){
        full += c.choices[0]?.delta?.content || '';
        out.innerHTML = md(full); chat.scrollTop=chat.scrollHeight;
      }
    } else {
      abort = new AbortController();
      const res = await fetch($('url').value.replace(/\/$/,'')+'/chat/completions',{
        method:'POST', signal:abort.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('key').value},
        body:JSON.stringify({model:$('apimodel').value,messages:msgs,stream:true})
      });
      if(!res.ok) throw new Error(await res.text());
      const rd=res.body.getReader(), dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await rd.read(); if(done) break;
        buf += dec.decode(value,{stream:true});
        const parts = buf.split('\n\n'); buf = parts.pop();
        for(const p of parts){
          const line = p.split('\n').find(l=>l.startsWith('data: '));
          if(!line) continue;
          const d = line.slice(6).trim();
          if(d==='[DONE]') continue;
          try{ full += JSON.parse(d).choices[0]?.delta?.content || ''; }catch{}
          out.innerHTML = md(full); chat.scrollTop=chat.scrollHeight;
        }
      }
    }
  }catch(e){
    if(e) out.innerHTML = md(full || '⚠️ '+e.message);
  }

  out.classList.remove('cursor');
  if(full) history.push({role:'assistant',content:full});
  if($('tts').checked && full) speechSynthesis.speak(new SpeechSynthesisUtterance(full.slice(0,500)));
  busy=false; $('send').disabled=false; $('stop').style.display='none';
}

$('send').onclick = send;
$('stop').onclick = () => { abort?.abort(); engine?.interruptGenerate?.(); };
box.addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
box.addEventListener('input', ()=>{ box.style.height='auto'; box.style.height=box.scrollHeight+'px'; });

/* ---------- extras ---------- */
$('clear').onclick = () => { history=[]; chat.innerHTML=''; };
$('export').onclick = () => {
  const blob = new Blob([history.map(m=>m.role.toUpperCase()+': '+m.content).join('\n\n')],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='chat.txt'; a.click();
};
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick = () => {
  if(!SR) return alert('Speech recognition not supported in this browser.');
  const r=new SR(); r.lang='en-US';
  r.onresult = e => { box.value = e.results[0][0].transcript; send(); };
  r.start(); status.textContent='🎤 Listening…';
  r.onend = () => status.textContent='';
};
</script>
</body>
</html>
